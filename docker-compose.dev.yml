services:
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev

    working_dir: /app

    command: sleep infinity

    init: true

    ports:
      - "3000:3000"
      - "4200:4200"
      - "5173:5173"
      - "8080:8080"

    volumes:
      - .:/app
      - app_node_modules:/app/node_modules

    environment:
      NODE_ENV: development

volumes:
  app_node_modules: