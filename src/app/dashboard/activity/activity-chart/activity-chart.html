<section class="activity-chart">
  <header class="activity-chart__header">
    <h2>Activity</h2>

    <div class="activity-chart__actions">
      <label class="activity-chart__period">
        <span class="activity-chart__visually-hidden">
          Chart period
        </span>
        <select
          [value]="store.chartPeriod()"
          aria-label="Chart period"
          (change)="changePeriod($event)"
        >
          <option value="7d">Last 7 days</option>
          <option value="30d">Last 30 days</option>
          <option value="90d">Last 90 days</option>
          <option value="all">All time</option>
        </select>
      </label>

      <button
        mat-button
        type="button"
        aria-label="Add chart marker"
        title="Add chart marker"
        (click)="addMarker()"
      >
        Add note
      </button>

      <button
        mat-icon-button
        type="button"
        aria-label="Configure chart lines"
        title="Configure chart lines"
        (click)="openSettings()"
      >
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M4 7h16" />
          <circle cx="9" cy="7" r="2" />
          <path d="M4 17h16" />
          <circle cx="15" cy="17" r="2" />
        </svg>
      </button>
    </div>
  </header>

  <p class="activity-chart__description">
    Daily net changes · Relative scale
  </p>

  <div class="activity-chart__plot">
    <canvas
      #chartCanvas
      role="img"
      aria-label="Daily metric activity chart"
    ></canvas>

    @if (store.chartMetricIds().length === 0) {
      <div class="activity-chart__empty">
        Select metrics to display chart lines.
      </div>
    }
  </div>

  <div class="activity-chart__legend">
    @for (metric of store.chartData().series; track metric.id) {
      <div class="activity-chart__legend-item">
        <span
          class="activity-chart__legend-color"
          [style.backgroundColor]="metric.color"
        ></span>

        <span>{{ metric.name }}</span>
      </div>
    }

    @for (marker of store.chartMarkers(); track marker.id) {
      <button
        class="activity-chart__legend-item activity-chart__legend-marker"
        type="button"
        [attr.aria-label]="'Edit chart marker: ' + marker.description"
        title="Edit chart marker"
        (click)="editMarker(marker)"
      >
        <span
          class="activity-chart__legend-color"
          [style.backgroundColor]="marker.color"
        ></span>

        <span>{{ marker.date }} · {{ marker.description }}</span>
      </button>
    }
  </div>
</section>
