<div
  class="metric-grid"
  cdkDropList
  cdkDropListOrientation="mixed"
  (cdkDropListDropped)="onDrop($event)"
>
  @for (metric of store.metrics(); track metric.id) {
    <div
      class="metric-grid__item"
      cdkDrag
    >
      <button
        type="button"
        class="metric-grid__drag-handle"
        cdkDragHandle
        [attr.aria-label]="'Drag ' + metric.name"
        [attr.title]="'Drag to reorder ' + metric.name"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="9" cy="5" r="1.5" />
          <circle cx="15" cy="5" r="1.5" />
          <circle cx="9" cy="12" r="1.5" />
          <circle cx="15" cy="12" r="1.5" />
          <circle cx="9" cy="19" r="1.5" />
          <circle cx="15" cy="19" r="1.5" />
        </svg>
      </button>

      <app-metric-card
        [metric]="metric"
        [value]="store.metricTotals().get(metric.id) ?? 0"
        (increment)="store.incrementMetric($event)"
        (decrement)="store.decrementMetric($event)"
        (edit)="editMetric($event)"
        (remove)="deleteMetric($event)"
      />
    </div>
  } @empty {
    <p class="metric-grid__empty">
      No metrics available.
    </p>
  }
</div>

<ng-template #deleteConfirmation>
  <h2 mat-dialog-title>
    Delete metric?
  </h2>

  <mat-dialog-content>
    <p>
      Delete "{{ metricToDelete()?.name }}" from the dashboard?
    </p>

    <p>
      Its event history will be preserved.
      Related conversions will be removed.
    </p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button
      mat-button
      type="button"
      mat-dialog-close
    >
      Cancel
    </button>

    <button
      mat-flat-button
      type="button"
      [mat-dialog-close]="true"
    >
      Delete
    </button>
  </mat-dialog-actions>
</ng-template>
