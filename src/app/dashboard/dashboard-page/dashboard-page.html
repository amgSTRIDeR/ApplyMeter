<section class="dashboard-page">
  @if (store.isLoading()) {
    <p class="dashboard-page__message" role="status">
      Loading metrics...
    </p>
  } @else if (store.loadError()) {
    <p class="dashboard-page__error" role="alert">
      Failed to load dashboard data.
    </p>
  } @else {
    @if (store.saveError()) {
      <p class="dashboard-page__error" role="alert">
        Failed to save changes.
      </p>
    }

    <app-metric-grid />
  }
</section>
